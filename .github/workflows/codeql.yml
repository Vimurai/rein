# CodeQL — static analysis of the JavaScript/TypeScript sources (E-384, D-133,
# .ai/blueprints/public-ci.md §Component 2). Required on main as "CodeQL" (§Component 3).
# Hand-written (no renderer); actions pinned to commit SHAs, Dependabot keeps them current.
# Rollback: delete this file and drop "CodeQL" from the branch protection's required checks.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC — new queries on an unchanged tree

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results to the security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          category: /language:javascript-typescript
