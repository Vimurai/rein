# Nightly — the full matrix on main (E-384, D-133, public-ci.md §Component 2): every PR leg
# plus the nightly-only ones (macOS × Node 24, one unsharded Ubuntu × 22 leg — D-135 r5),
# `npm audit --audit-level=high`, and the D-118 r1 drift line as the job summary. On failure
# ONE issue labelled `nightly` is created or updated — never duplicated.
# Hand-written; actions pinned to commit SHAs. Rollback: delete this file.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Full matrix
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '22'

      # The root lockfile and every server that carries its own.
      - name: npm audit (high and above)
        run: |
          rc=0
          npm audit --audit-level=high || rc=1
          for d in src/mcp/*/; do
            if [ -f "${d}package-lock.json" ]; then (cd "$d" && npm audit --audit-level=high) || rc=1; fi
          done
          exit "$rc"

  # The unsharded leg's budget line against the median of the last five nightlies (D-118 r1:
  # +25 % on full_seconds or a peak prints [BUDGET_DRIFT]; information, never a failure). A
  # hosted runner has no ci_runs history, so the last five lines ride in the Actions cache.
  summary:
    name: Drift summary
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '22'

      - name: Download the run logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: rein-ci-run-*
          path: logs

      - name: Restore the budget history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .nightly-budget
          key: nightly-budget-${{ github.run_id }}
          restore-keys: nightly-budget-

      - name: Write the summary
        run: node .github/scripts/nightly-summary.mjs logs .nightly-budget/history.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Save the budget history
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .nightly-budget
          key: nightly-budget-${{ github.run_id }}

  report:
    name: Report a failure
    needs: [matrix, audit]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write   # the one nightly issue
    steps:
      - name: Create or update the nightly issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3   # v9.0.0
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            const body = `The nightly run failed on ${date}: ${run}\n\nRead the failed legs' artefacts (\`rein ci log --failed\` locally reads the same log).`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, labels: "nightly", state: "open", per_page: 1 });
            if (open.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, title: `Nightly failed on ${date}`, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: `Nightly failed on ${date}`, body, labels: ["nightly"] });
            }
