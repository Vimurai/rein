<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Rein: the Architect and the Engineer</title>
  <desc id="d">Two Claude Code panes, the Architect and the Engineer, wake each other with SendMessage and share the .ai memory. The Engineer dispatches critics and the Tester. Commits pass a pre-commit gate, local CI and a pre-push gate.</desc>
  <style>
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 12; }
    .mem { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 12; }
    .crit { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 12; }
    .gate { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
    .h { font-size: 20px; font-weight: 700; fill: #111827; }
    .s { font-size: 14px; fill: #374151; }
    .no { font-size: 14px; fill: #b91c1c; }
    .lbl { font-size: 13px; fill: #4b5563; font-style: italic; }
    .ln { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1020; }
      .box { fill: #111827; stroke: #e5e7eb; }
      .mem { fill: #1e1b4b; stroke: #a5b4fc; }
      .crit { fill: #052e16; stroke: #86efac; }
      .gate { fill: #431407; stroke: #fdba74; }
      .h { fill: #f9fafb; } .s { fill: #d1d5db; } .lbl { fill: #9ca3af; } .no { fill: #fca5a5; }
      .ln { stroke: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="520" fill="none"/>

  <rect class="box" x="30" y="30" width="300" height="150"/>
  <text class="h" x="50" y="64">Architect</text>
  <text class="s" x="50" y="88">claude · fable · pane 1</text>
  <text class="s" x="50" y="114">blueprints, tasks, decisions</text>
  <text class="no" x="50" y="160">✗ cannot edit source</text>

  <rect class="box" x="550" y="30" width="300" height="150"/>
  <text class="h" x="570" y="64">Engineer</text>
  <text class="s" x="570" y="88">claude · opus · pane 0</text>
  <text class="s" x="570" y="114">code, tests, review, commits</text>
  <text class="no" x="570" y="160">✗ cannot edit the plan</text>

  <path class="ln" d="M335,85 L545,85"/>
  <path class="ln" d="M545,125 L335,125"/>
  <text class="lbl" x="372" y="76">SendMessage (wake)</text>
  <text class="lbl" x="392" y="146">handoff in COMM.md</text>

  <rect class="mem" x="250" y="230" width="380" height="140"/>
  <text class="h" x="270" y="262">.ai/ — shared memory</text>
  <text class="s" x="270" y="288">state.sqlite (ACID, WAL) · TASKS · DIGEST</text>
  <text class="s" x="270" y="312">architect.md · blueprints/ · DECISIONS</text>
  <text class="s" x="270" y="336">COMM · LOG · REVIEWS (stamps)</text>

  <path class="ln" d="M180,185 L300,225"/>
  <path class="ln" d="M700,185 L580,225"/>

  <rect class="crit" x="660" y="230" width="190" height="140"/>
  <text class="h" x="676" y="262">Critics</text>
  <text class="s" x="676" y="288">arch · security</text>
  <text class="s" x="676" y="312">tests · clean code</text>
  <text class="s" x="676" y="336">Tester (sonnet)</text>
  <path class="ln" d="M790,185 L790,225"/>

  <rect class="gate" x="30" y="420" width="190" height="64"/>
  <text class="s" x="48" y="448">git commit</text>
  <text class="s" x="48" y="470">pre-commit gate</text>
  <rect class="gate" x="345" y="420" width="190" height="64"/>
  <text class="s" x="363" y="448">rein ci run</text>
  <text class="s" x="363" y="470">clean worktree, budget</text>
  <rect class="gate" x="660" y="420" width="190" height="64"/>
  <text class="s" x="678" y="448">git push</text>
  <text class="s" x="678" y="470">pre-push gate</text>
  <path class="ln" d="M225,452 L340,452"/>
  <path class="ln" d="M540,452 L655,452"/>
</svg>
