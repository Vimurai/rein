schema_version: "1.1"
name: ai-preflight
description: Preflight reads DIGEST before TASKS and never opens architect.md (E-285, D-075 §8).
tags: [core-skill]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
  # No Bash: a `head .ai/DIGEST.md` would read the file without a Read call, and the order
  # graders below observe Read calls.
  disallowed_tools: [Bash]
  prompt: |
    You are the Engineer in this Rein project. Start the session: run the ai-preflight skill, then tell me which task is next.
