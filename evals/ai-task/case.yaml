schema_version: "1.1"
name: ai-task
description: ai-task marks DONE through update_task_status, then run_handover; the status call only happens inside the skill (E-285).
tags: [core-skill]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I just finished E-900: src/greet.js now takes a --name flag, its test passes and local CI is PASS for HEAD. Close the task out with the ai-task skill.
