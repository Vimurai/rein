schema_version: "1.1"
name: rein-handoff
description: rein-handoff appends a COMM.md packet, then wakes the Architect with SendMessage as its last action (E-285, D-099).
tags: [core-skill]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash, ToolSearch, ListAgents, SendMessage]
  prompt: |
    E-900 and E-901 are done and the Engineer queue is exhausted. Hand control back to the Architect with the rein-handoff skill.
